name: LocalEats CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore Restaurants.API.sln
      - name: Report vulnerable NuGet packages
        run: dotnet list Restaurants.API.sln package --vulnerable --include-transitive
      - name: Build solution
        run: dotnet build Restaurants.API.sln --no-restore -c Release
      - name: Run tests
        run: dotnet test Restaurants.API.sln --no-build -c Release
      - name: Build container image
        run: docker build --tag localeats:ci .

