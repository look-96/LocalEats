name: LocalEats CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore Restaurants.API.sln
      - name: Build solution
        run: dotnet build Restaurants.API.sln --no-restore -c Release
      - name: Run tests
        run: dotnet test Restaurants.API.sln --no-build -c Release
      - name: Build container image
        run: docker build --tag localeats:ci .

